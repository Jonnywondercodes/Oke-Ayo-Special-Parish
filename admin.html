<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · Oke Ayo Parish</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="box">
 <h2 style="margin:0">Admin sign in</h2>
 <div><label>Email</label><input id="em" type="email" autocomplete="username"></div>
 <div><label>Password</label><input id="pw" type="password" autocomplete="current-password"></div>
 <button class="btn p" id="go">Sign in</button><div class="err" id="lerr"></div>
</div>

<div id="app" hidden>
 <header><b>Parish admin <small id="who"></small></b>
  <button class="tab on" data-t="hymns">Hymns</button><button class="tab" data-t="programs">Programs</button><button class="tab" data-t="history">History</button>
  <button class="tab" id="out">Sign out</button></header>
 <main>
  <section id="t-hymns" class="cols">
   <div class="card"><button class="btn p" id="hnew" style="width:100%">+ New hymn</button>
    <input id="hq" placeholder="Search number or title…" style="margin-top:10px"><div class="list" id="hl"></div></div>
   <div class="card" id="he"><p class="mut">Pick a hymn on the left, or add a new one.</p></div>
  </section>
  <section id="t-programs" class="cols" hidden>
   <div class="card"><button class="btn p" id="pnew" style="width:100%">+ New program</button><div class="list" id="pl"></div></div>
   <div class="card" id="pe"><p class="mut">Pick a program to edit. For a weekly service, switch the live link on and paste the stream URL.</p></div>
  </section>
  <section id="t-history" class="cols" hidden>
   <div class="card"><button class="btn p" id="znew" style="width:100%">+ New entry</button><div class="list" id="zl"></div></div>
   <div class="card" id="ze"><p class="mut">Pick a history entry to edit.</p></div>
  </section>
 </main>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
